# # Run: gcloud builds submit --config=builds/prod.cloudbuild.yaml
steps:
  # Fetch the .env secret
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'access-env'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Fetching .env file..."
        gcloud secrets versions access latest --secret=${_ENV_SECRET_NAME} > .env

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/solveiit-backend/${_IMAGE_NAME}:${_AUTO_TAG}
      - -f
      - ${_DOCKERFILE}
      - .

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/solveiit-backend/${_IMAGE_NAME}:${_AUTO_TAG}

  # Deploy main API service
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/solveiit-backend/${_IMAGE_NAME}:${_AUTO_TAG}
      - --region
      - us-central1
      - --platform
      - managed
      - --allow-unauthenticated

  # Deploy PubSub service
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - ${_SERVICE_NAME_PUBSUB}
      - --image
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/solveiit-backend/${_IMAGE_NAME}:${_AUTO_TAG}
      - --region
      - us-central1
      - --platform
      - managed
      - --allow-unauthenticated

substitutions:
  _PROJECT_ID: 'solveiit'
  _IMAGE_NAME: 'solveiit-backend'
  _AUTO_TAG: '1.0.0'
  _DOCKERFILE: 'prod.Dockerfile'
  _SERVICE_NAME: 'solveiit-api'
  _SERVICE_NAME_PUBSUB: 'solveiit-pubsub'
  _ENV_SECRET_NAME: 'env-file'
